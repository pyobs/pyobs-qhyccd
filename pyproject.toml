[project]
name = "pyobs-qhyccd"
version = "2.3.0"
description = "pyobs module for QHYCCD cameras"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }]
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "astropy>=7.0.1,<8",
    "numpy>=2.2.5,<3",
    "pyobs-core>=2.28.0,<3",
]

[project.urls]
Homepage = "https://www.pyobs.org"
Documentation = "https://docs.pyobs.org"
Repository = "https://github.com/pyobs/pyobs-qhyccd"
Issues = "https://github.com/pyobs/pyobs-qhyccd/issues"

[project.optional-dependencies]
gui = [
    "pyobs-core[gui]>=2.28.0,<3",
    "qasync>=0.28.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0,<27",
    "ruff>=0.9.0",
    "pyrefly>=1.1.1",
    "pre-commit>=4.2.0,<5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
qhyccd-gui = 'pyobs_qhyccd.gui:main'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyobs_qhyccd"]

[tool.hatch.build.targets.sdist]
exclude = ["lib", "characterization"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]

[tool.pyrefly]
python-version = "3.11"
project-excludes = ["pyobs_qhyccd/gui.py"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
